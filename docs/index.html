<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledger Documentation</title>
  <meta name="description" content="Documentation for Ledger - Personal Budget Tracking App">

  <!-- Docsify theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <!-- Custom styles matching Ledger design system -->
  <style>
    :root {
      --theme-color: #C45D3A;
      --theme-color-dark: #B5522F;
      --text-color: #2D2A26;
      --background: #FAF8F5;
    }

    body {
      background: var(--background);
    }

    .sidebar {
      background: #fff;
      border-right: 1px solid #e8e4df;
    }

    .sidebar-nav a {
      color: var(--text-color);
    }

    .sidebar-nav a:hover,
    .sidebar-nav a.active {
      color: var(--theme-color);
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      color: var(--text-color);
    }

    .markdown-section a {
      color: var(--theme-color);
    }

    .markdown-section a:hover {
      color: var(--theme-color-dark);
    }

    .markdown-section code {
      background: #f5f2ef;
      color: var(--theme-color-dark);
    }

    .markdown-section pre {
      background: #2D2A26;
    }

    .markdown-section table th {
      background: var(--theme-color);
      color: white;
    }

    .markdown-section table tr:nth-child(even) {
      background: #f9f7f4;
    }

    .cover-main {
      background: linear-gradient(135deg, var(--theme-color) 0%, var(--theme-color-dark) 100%) !important;
    }

    .cover-main a {
      background: white !important;
      color: var(--theme-color) !important;
    }

    .cover-main a:hover {
      background: var(--background) !important;
    }

    /* Search highlight */
    .search .matching-post {
      border-bottom: 1px solid #e8e4df;
    }

    .search .matching-post .search-keyword {
      background: #fef3c7;
      color: var(--text-color);
    }

    /* App name in sidebar */
    .app-name-link {
      font-weight: 700;
      color: var(--theme-color) !important;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>

  <script>
    window.$docsify = {
      name: 'Ledger',
      repo: '',
      loadSidebar: true,
      coverpage: true,
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 2,

      // Search plugin config
      search: {
        placeholder: 'Search docs...',
        noData: 'No results',
        depth: 3
      },

      // Copy code button
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied'
      },

      // Pagination
      pagination: {
        previousText: 'Previous',
        nextText: 'Next'
      }
    }
  </script>

  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>

  <!-- Syntax highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-svelte.min.js"></script>
</body>
</html>
